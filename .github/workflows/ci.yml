name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heirloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heirloom_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-test-secret-never-use-in-production-12345
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run typecheck
      - name: Verify account and permission flows
        run: |
          npm start > /tmp/heirloom.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          npm run test:integration
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/heirloom.log 2>/dev/null || true
